<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST CASH - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 15px; margin: 0; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; margin: 10px auto; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 8px; cursor: pointer; margin-top: 8px; width: 100%; }
        button:active { background: #2563eb; }
        input, select { width: 90%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; }
        .task-item { background: #334155; padding: 10px; margin-top: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .task-item button { width: auto; padding: 6px 12px; margin: 0; background: #10b981; }
        .admin-section { background: #1e1b4b; border: 1px solid #6366f1; display: none; text-align: left; }
        .admin-nav { display: flex; gap: 5px; margin-bottom: 10px; }
        .admin-nav button { background: #475569; font-size: 12px; padding: 6px; }
        .admin-nav button.active { background: #3b82f6; }
        .user-row { background: #334155; padding: 8px; margin-top: 6px; border-radius: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- ইউজার ড্যাশবোর্ড -->
    <div class="card" id="userDashboard">
        <h2>🔥 FAST CASH 🔥</h2>
        <p>স্বাগতম, <span id="username">ইউজার</span>!</p>
        <h3>ব্যালেন্স: <span id="balance">0</span> TK</h3>
        <p>রেফার সংখ্যা: <span id="referCount">0</span></p>
        <button onclick="toggleAdminPanel()" style="background: #64748b; font-size: 12px; padding: 6px;">অ্যাডমিন প্যানেল ওপেন করুন</button>
    </div>

    <!-- টাস্ক লিস্ট -->
    <div class="card">
        <h3>🎯 টেলিগ্রাম টাস্ক লিস্ট</h3>
        <div id="taskList">লোড হচ্ছে...</div>
    </div>

    <!-- রেফার লিংক -->
    <div class="card">
        <h3>আপনার রেফার লিংক</h3>
        <input type="text" id="referLink" readonly>
        <button onclick="copyReferLink()">লিংক কপি করুন</button>
    </div>

    <!-- মনিটাইজেশন অ্যাড বক্স -->
    <div class="card" id="adContainer">
        <p style="font-size: 12px; color: #94a3b8;">--- বিজ্ঞাপন ---</p>
        <div id="monetizationAdBox">
            <!-- আপনার Monetag বা Adsterra এর অ্যাড কোড এখানে পেস্ট করতে পারেন -->
            <p style="font-size: 13px; color: #cbd5e1;">অ্যাড কোড এখানে শো করবে</p>
        </div>
    </div>

    <!-- অ্যাডমিন প্যানেল -->
    <div class="card admin-section" id="adminPanel">
        <h3 style="text-align: center;">⚙️ অ্যাডমিন কন্ট্রোল প্যানেল</h3>
        <p id="adminStatus" style="font-size: 12px; color: #f87171; text-align: center;">পাসওয়ার্ড দিয়ে প্রবেশ করুন</p>
        
        <div id="adminLoginBox">
            <input type="password" id="adminPass" placeholder="অ্যাডমিন পাসওয়ার্ড দিন">
            <button onclick="loginAdmin()">লগইন করুন</button>
        </div>

        <div id="adminControls" style="display: none;">
            <!-- অ্যাডমিন পেজ নেভিগেশন বাটন -->
            <div class="admin-nav">
                <button id="navBtn1" class="active" onclick="switchAdminTab('tasks')">১. টাস্ক ম্যানেজমেন্ট</button>
                <button id="navBtn2" onclick="switchAdminTab('users')">২. ইউজার লিস্ট ও স্ট্যাটস</button>
            </div>

            <!-- পেজ ১: টাস্ক ম্যানেজমেন্ট -->
            <div id="adminTabTasks">
                <h4>নতুন টাস্ক যোগ করুন</h4>
                <input type="text" id="newTaskTitle" placeholder="টাস্কের নাম (যেমন: Join Channel 1)">
                <input type="text" id="newTaskLink" placeholder="টেলিগ্রাম লিংক (https://t.me/...)">
                <input type="number" id="newTaskReward" placeholder="পুরস্কার (টাকা)">
                <button onclick="addNewTask()" style="background: #8b5cf6;">টাস্ক পাবলিশ করুন</button>
            </div>

            <!-- পেজ ২: ইউজার লিস্ট ও স্ট্যাটস -->
            <div id="adminTabUsers" style="display: none;">
                <h4>সকল ইউজারের তালিকা</h4>
                <div id="allUsersList" style="max-height: 250px; overflow-y: auto;">
                    <p style="font-size: 12px; color: #94a3b8;">লোড হচ্ছে...</p>
                </div>
            </div>

            <button onclick="logoutAdmin()" style="background: #ef4444; margin-top: 15px;">লগআউট</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB3z_-UG_Q-x8HpCUGv_aK-d1V",
          authDomain: "fast-cash-521d1.firebaseapp.com",
          projectId: "fast-cash-521d1",
          storageBucket: "fast-cash-521d1.firebasestorage.app",
          messagingSenderId: "854435436871",
          appId: "1:854435436871:web:cd29d32194907...",
          measurementId: "G-P40FXRCD44"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (!user) {
            document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:#ff4d4d;'>অনুগ্রহ করে টেলিগ্রাম বটের মাধ্যমে অ্যাপটি ওপেন করুন!</h2>";
            throw new Error("Not a Telegram user");
        }

        const userId = String(user.id);
        const userName = user.first_name || "User";
        document.getElementById("username").innerText = userName;

        const startParam = tg.initDataUnsafe?.start_param; 

        async function initUser() {
            const userRef = doc(db, "users", userId);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                let referrerId = null;
                if (startParam && startParam !== userId) {
                    const referrerRef = doc(db, "users", startParam);
                    const referrerSnap = await getDoc(referrerRef);
                    if (referrerSnap.exists()) {
                        referrerId = startParam;
                        await updateDoc(referrerRef, {
                            balance: increment(10),
                            referCount: increment(1)
                        });
                    }
                }

                await setDoc(userRef, {
                    name: userName,
                    balance: 5,
                    referCount: 0,
                    referrer: referrerId,
                    completedTasks: [],
                    createdAt: new Date()
                });

                document.getElementById("balance").innerText = "5";
                document.getElementById("referCount").innerText = "0";
            } else {
                const userData = userSnap.data();
                document.getElementById("balance").innerText = userData.balance || 0;
                document.getElementById("referCount").innerText = userData.referCount || 0;
            }

            const botUsername = "FAST_ASH77_Bot"; 
            const refLink = `https://t.me/${botUsername}?start=${userId}`;
            document.getElementById("referLink").value = refLink;
            loadTasks();
        }

        initUser();

        window.loadTasks = async function() {
            const taskListDiv = document.getElementById("taskList");
            try {
                const querySnapshot = await getDocs(collection(db, "tasks"));
                taskListDiv.innerHTML = "";
                if(querySnapshot.empty) {
                    taskListDiv.innerHTML = "<p style='font-size:13px; color:#94a3b8;'>কোনো টাস্ক নেই</p>";
                    return;
                }
                querySnapshot.forEach((docSnap) => {
                    const task = docSnap.data();
                    const taskId = docSnap.id;
                    taskListDiv.innerHTML += `
                        <div class="task-item">
                            <div style="text-align: left;">
                                <strong style="font-size: 13px;">${task.title}</strong><br>
                                <span style="font-size: 11px; color: #38bdf8;">বোনাস: ${task.reward} TK</span>
                            </div>
                            <button onclick="completeTask('${taskId}', '${task.link}', ${task.reward})">ভিজিট করুন</button>
                        </div>
                    `;
                });
            } catch (e) {
                taskListDiv.innerHTML = "<p style='color:red; font-size:12px;'>টাস্ক লোড করতে সমস্যা হয়েছে</p>";
            }
        }

        window.completeTask = async function(taskId, link, reward) {
            const userRef = doc(db, "users", userId);
            const userSnap = await getDoc(userRef);
            const userData = userSnap.data();

            let completedTasks = userData.completedTasks || [];
            if (completedTasks.includes(taskId)) {
                alert("আপনি ইতিমধ্যে এই টাস্কটি সম্পন্ন করেছেন!");
                window.open(link, '_blank');
                return;
            }

            completedTasks.push(taskId);
            await updateDoc(userRef, {
                balance: increment(reward),
                completedTasks: completedTasks
            });

            document.getElementById("balance").innerText = Number(document.getElementById("balance").innerText) + reward;
            alert(`অভিনন্দন! আপনি ${reward} টাকা বোনাস পেয়েছেন।`);
            window.open(link, '_blank');
        }

        window.toggleAdminPanel = function() {
            const panel = document.getElementById("adminPanel");
            panel.style.display = panel.style.display === "block" ? "none" : "block";
        }

        window.loginAdmin = function() {
            const pass = document.getElementById("adminPass").value;
            if (pass === "1234") { 
                document.getElementById("adminLoginBox").style.display = "none";
                document.getElementById("adminControls").style.display = "block";
                document.getElementById("adminStatus").innerText = "অ্যাডমিন হিসেবে লগইন সফল!";
                document.getElementById("adminStatus").style.color = "#4ade80";
                loadAllUsers(); 
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        window.logoutAdmin = function() {
            document.getElementById("adminLoginBox").style.display = "block";
            document.getElementById("adminControls").style.display = "none";
            document.getElementById("adminStatus").innerText = "পাসওয়ার্ড দিয়ে প্রবেশ করুন";
            document.getElementById("adminStatus").style.color = "#f87171";
            document.getElementById("adminPass").value = "";
        }

        window.switchAdminTab = function(tabName) {
            const tabTasks = document.getElementById("adminTabTasks");
            const tabUsers = document.getElementById("adminTabUsers");
            const btn1 = document.getElementById("navBtn1");
            const btn2 = document.getElementById("navBtn2");

            if (tabName === 'tasks') {
                tabTasks.style.display = "block";
                tabUsers.style.display = "none";
                btn1.classList.add("active");
                btn2.classList.remove("active");
            } else {
                tabTasks.style.display = "none";
                tabUsers.style.display = "block";
                btn2.classList.add("active");
                btn1.classList.remove("active");
                loadAllUsers();
            }
        }

        window.loadAllUsers = async function() {
            const usersListDiv = document.getElementById("allUsersList");
            usersListDiv.innerHTML = "লোড হচ্ছে...";
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                usersListDiv.innerHTML = "";
                if(querySnapshot.empty) {
                    usersListDiv.innerHTML = "<p style='font-size:12px; color:#94a3b8;'>কোনো ইউজার নেই</p>";
                    return;
                }
                querySnapshot.forEach((docSnap) => {
                    const uData = docSnap.data();
                    usersListDiv.innerHTML += `
                        <div class="user-row">
                            <div style="text-align: left;">
                                <strong>👤 ${uData.name || 'Unknown'}</strong><br>
                                <span style="color: #94a3b8; font-size: 10px;">ID: ${docSnap.id}</span>
                            </div>
                            <div style="text-align: right;">
                                <span style="color: #4ade80;">টাকা: ${uData.balance || 0} TK</span><br>
                                <span style="color: #38bdf8;">রেফার: ${uData.referCount || 0} টি</span>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                usersListDiv.innerHTML = "<p style='color:red; font-size:12px;'>ইউজার ডাটা লোড করতে সমস্যা হয়েছে</p>";
            }
        }

        window.addNewTask = async function() {
            const title = document.getElementById("newTaskTitle").value;
            const link = document.getElementById("newTaskLink").value;
            const reward = Number(document.getElementById("newTaskReward").value);

            if (!title || !link || !reward) {
                alert("সবগুলো ঘর পূরণ করুন!");
                return;
            }

            try {
                await addDoc(collection(db, "tasks"), {
                    title: title,
                    link: link,
                    reward: reward,
                    createdAt: new Date()
                });
                alert("টাস্ক সফলভাবে যুক্ত হয়েছে!");
                document.getElementById("newTaskTitle").value = "";
                document.getElementById("newTaskLink").value = "";
                document.getElementById("newTaskReward").value = "";
                loadTasks();
            } catch (e) {
                alert("টাস্ক সেভ করতে সমস্যা হয়েছে: " + e.message);
            }
        }

        window.copyReferLink = function() {
            const copyText = document.getElementById("referLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("রেফার লিংক কপি সফল হয়েছে!");
        }
    </script>
</body>
            </html>
